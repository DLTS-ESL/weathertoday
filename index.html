
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bang Kruai Air Quality</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  background: #16834a;
  color: white;
  overflow: hidden;
  transition: background 0.5s ease;
}

#app {
  width: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 3vh 4vw;
}

.location {
  font-size: clamp(24px, 4vw, 48px);
  font-weight: 700;
  letter-spacing: 1px;
}

.subtitle {
  font-size: clamp(16px, 2vw, 26px);
  margin-top: 8px;
  opacity: 0.9;
}

#aqi {
  font-size: clamp(160px, 34vw, 390px);
  font-weight: 900;
  line-height: 0.95;
  letter-spacing: -8px;
  margin: 1vh 0;
}

#status {
  font-size: clamp(36px, 7vw, 82px);
  font-weight: 800;
  margin: 1vh 0;
}

.details {
  font-size: clamp(22px, 3vw, 38px);
  font-weight: 600;
  margin-top: 2vh;
}

#updated {
  font-size: clamp(14px, 1.5vw, 20px);
  margin-top: 3vh;
  opacity: 0.85;
}

#message {
  font-size: clamp(16px, 2vw, 24px);
  margin-top: 1.5vh;
}

@media (max-height: 600px) {
  #aqi {
    font-size: min(35vh, 250px);
    margin: 0;
  }

  #status {
    font-size: min(8vh, 48px);
    margin: 0;
  }

  .details {
    margin-top: 1vh;
  }

  #updated {
    margin-top: 1vh;
  }
}
</style>
</head>

<body>
<div id="app">
  <div class="location">AIR QUALITY</div>
  <div class="subtitle">Bang Kruai · Nonthaburi, Thailand</div>

  <div id="aqi">--</div>
  <div id="status">Loading...</div>

  <div class="details">
    PM2.5: <span id="pm25">--</span> µg/m³
  </div>

  <div id="message">Checking the latest available air quality data...</div>
  <div id="updated">Connecting...</div>
</div>

<script>
const latitude = 13.805;
const longitude = 100.472;

async function loadAQI() {
  const updated = document.getElementById("updated");
  const message = document.getElementById("message");

  try {
    const url =
      `https://air-quality-api.open-meteo.com/v1/air-quality` +
      `?latitude=${latitude}` +
      `&longitude=${longitude}` +
      `&current=us_aqi,pm2_5` +
      `&timezone=Asia%2FBangkok`;

    const response = await fetch(url);

    if (!response.ok) throw new Error("Data unavailable");

    const data = await response.json();
    const current = data.current;

    if (current.us_aqi == null) {
      throw new Error("AQI unavailable");
    }

    const aqi = Math.round(current.us_aqi);
    const pm = current.pm2_5;

    let color, status, advice;

    if (aqi <= 50) {
      color = "#16834a";
      status = "GOOD";
      advice = "Great air for outdoor activities!";
    } else if (aqi <= 100) {
      color = "#b9a900";
      status = "MODERATE";
      advice = "Sensitive students should take care.";
    } else if (aqi <= 150) {
      color = "#d96b00";
      status = "UNHEALTHY FOR SENSITIVE GROUPS";
      advice = "Sensitive students should limit outdoor activity.";
    } else if (aqi <= 200) {
      color = "#c62828";
      status = "UNHEALTHY";
      advice = "Reduce prolonged outdoor activities.";
    } else if (aqi <= 300) {
      color = "#7626a8";
      status = "VERY UNHEALTHY";
      advice = "Avoid outdoor exercise where possible.";
    } else {
      color = "#681b27";
      status = "HAZARDOUS";
      advice = "Avoid outdoor activities.";
    }

    document.body.style.background = color;
    document.getElementById("aqi").textContent = aqi;
    document.getElementById("status").textContent = status;
    document.getElementById("pm25").textContent =
      pm == null ? "--" : Number(pm).toFixed(1);

    message.textContent = advice;

    const time = new Date(current.time);
    updated.textContent =
      "Last updated: " +
      time.toLocaleString("en-GB", {
        timeZone: "Asia/Bangkok",
        day: "numeric",
        month: "short",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }) +
      " · Bangkok time";

  } catch (error) {
    document.getElementById("aqi").textContent = "--";
    document.getElementById("status").textContent = "DATA UNAVAILABLE";
    document.getElementById("pm25").textContent = "--";
    message.textContent =
      "Please check the internet connection.";
    updated.textContent = "Unable to retrieve current data.";
    document.body.style.background = "#424b55";
  }
}

loadAQI();
setInterval(loadAQI, 10 * 60 * 1000);
</script>
</body>
</html>
